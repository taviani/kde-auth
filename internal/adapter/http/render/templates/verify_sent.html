<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · kde-auth</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 4rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
    p { line-height: 1.5; color: #333; }
    .msg { padding: 0.75rem; margin-bottom: 1.25rem; border-radius: 4px; background: #e8f0fe; color: #1a3a6b; }
    .cta {
      display: block; margin-top: 1.5rem; width: 100%; padding: 0.7rem;
      background: #111; color: #fff; border: none; text-align: center;
      text-decoration: none; box-sizing: border-box;
    }
    .footer { margin-top: 2rem; font-size: 0.85rem; }
    a { color: #111; }
  </style>
</head>
<body>
  <div class="msg">Check your inbox</div>
  <h1>Verify your email</h1>
  <p>We sent a verification link to <strong>{{.Email}}</strong>. Open it to activate your account.</p>
  <a class="cta" href="/login">Go to sign in</a>
</body>
</html>
