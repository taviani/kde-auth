<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · kde-auth</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 4rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
    p { line-height: 1.5; color: #333; }
    .msg { padding: 0.75rem; margin-bottom: 1.25rem; border-radius: 4px; background: #e6f4ea; color: #1e6b3a; }
    .cta {
      display: block; margin-top: 1.5rem; width: 100%; padding: 0.7rem;
      background: #111; color: #fff; text-align: center; text-decoration: none; box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="msg">{{.Success}}</div>
  <h1>Password updated</h1>
  <p>You can sign in with your new password.</p>
  <a class="cta" href="/login">Sign in</a>
</body>
</html>
